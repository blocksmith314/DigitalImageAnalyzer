name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja qt ffmpeg pkg-config

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TEST=OFF -DCMAKE_PREFIX_PATH="$(brew --prefix)"

      - name: Build
        run: cmake --build build

      - name: Bundle
        env:
          DIA_MIN_MACOS: "14.0"
          DIA_STRICT_MINOS: "1"
        run: |
          chmod +x scripts/bundle_macos.sh
          scripts/bundle_macos.sh build/DigitalImageAnalyzer.app
          ditto -c -k --keepParent build/DigitalImageAnalyzer.app DigitalImageAnalyzer-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: DigitalImageAnalyzer-macos-arm64.zip

  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja qt ffmpeg pkg-config

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TEST=OFF -DCMAKE_PREFIX_PATH="$(brew --prefix)"

      - name: Build
        run: cmake --build build

      - name: Bundle
        env:
          DIA_MIN_MACOS: "15.0"
          DIA_STRICT_MINOS: "1"
        run: |
          chmod +x scripts/bundle_macos.sh
          scripts/bundle_macos.sh build/DigitalImageAnalyzer.app
          ditto -c -k --keepParent build/DigitalImageAnalyzer.app DigitalImageAnalyzer-macos-intel.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-intel
          path: DigitalImageAnalyzer-macos-intel.zip

  windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-multimedia
            mingw-w64-x86_64-ffmpeg
            zip

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TEST=OFF -DCMAKE_PREFIX_PATH=/mingw64

      - name: Build
        run: cmake --build build

      - name: Bundle
        run: |
          chmod +x scripts/bundle_windows.sh
          scripts/bundle_windows.sh build/DigitalImageAnalyzer.exe dist
          (cd dist && zip -r ../DigitalImageAnalyzer-windows-x64.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: DigitalImageAnalyzer-windows-x64.zip

  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            qt6-base-dev qt6-multimedia-dev \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TEST=OFF

      - name: Build
        run: cmake --build build

      - name: Bundle (AppImage)
        run: |
          set -e
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$(command -v qmake6 || command -v qmake)"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --executable build/DigitalImageAnalyzer \
            --desktop-file packaging/linux/DigitalImageAnalyzer.desktop \
            --icon-file packaging/linux/digitalimageanalyzer.png \
            --plugin qt --output appimage
          appimage="$(find . -maxdepth 1 -name '*.AppImage' -size +1M | head -1)"
          mv "$appimage" DigitalImageAnalyzer-linux-x64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: DigitalImageAnalyzer-linux-x64.AppImage

  release:
    needs: [macos-arm64, macos-intel, linux-x64, windows-x64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.AppImage
          generate_release_notes: true
